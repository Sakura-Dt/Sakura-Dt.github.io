name: Check site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify published pages and resource paths
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          pages = {Path("index.html"), Path("projects/index.html")}
          assert set(Path(".").rglob("*.html")) == pages
          assert Path(".nojekyll").is_file()
          assert Path("visual/hero-main.png").stat().st_size > 0

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.references = []

              def handle_starttag(self, tag, attrs):
                  self.references.extend(value for name, value in attrs
                                         if name in {"href", "src"} and value)

          for page in sorted(pages):
              parser = Links()
              parser.feed(page.read_text(encoding="utf-8"))
              for reference in parser.references:
                  url = urlsplit(reference)
                  if url.scheme or url.netloc or not url.path:
                      continue
                  assert not url.path.startswith("/"), (page, reference)
                  asset = page.parent / unquote(url.path)
                  assert asset.is_file(), (page, reference)
              print(f"{page}: all HTML resource paths resolve")
          PY
